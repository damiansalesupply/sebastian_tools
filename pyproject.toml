[project]
name = "comments_export"
version = "0.1.0"
description = "comments_export"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "beautifulsoup4>=4.13.5",
    "bs4>=0.0.2",
    "dotenv>=0.9.9",
    "fastapi>=0.136.1",
    "ipykernel>=7.2.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "jupyter>=1.1.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pydantic>=2.11.7",
    "pyotp>=2.9.0",
    "python-multipart>=0.0.27",
    "pyyaml>=6.0.3",
    "qrcode[pil]>=8.2",
    "starlette>=1.0.0",
    "tqdm>=4.67.3",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[tool.ruff]
line-length = 130
