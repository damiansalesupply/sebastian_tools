[project]
name = "comments_export"
version = "0.1.0"
description = "comments_export"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1.5",
    "pandas>=3.0",
    "pydantic>=2.11",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=7.0",
    "jupyter>=1.0",
]
openai = [
    "openai>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[tool.ruff]
line-length = 130
